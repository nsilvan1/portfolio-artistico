<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Nathan Silva — Currículo artístico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 15mm 16mm 16mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  :root {
    --tinta: #15151c; --tinta-2: #4b4b57; --tinta-3: #7c7c88; --linha: #dcdce3; --fundo-suave: #f4f4f7;
    --coral: #d9442f; --f: 'Plus Jakarta Sans', system-ui, sans-serif;
  }
  body { font-family: var(--f); color: var(--tinta); font-size: 9pt; line-height: 1.5; background: #fff; }
  @media screen {
    body { background: #e7e7ec; padding: 64px 0 40px; }
    .folha { width: 210mm; margin: 0 auto; background: #fff; padding: 15mm 16mm 16mm; box-shadow: 0 10px 40px rgba(0,0,0,.15); }
  }
  .barra { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 18px; background: #15151c; color: #eee; font: 500 13px var(--f); }
  .barra button { font: 700 13px var(--f); cursor: pointer; background: #ff5d4a; color: #fff; border: 0; border-radius: 99px; padding: 9px 20px; }
  @media print { .barra { display: none !important; } }

  /* cabeçalho */
  .cab { display: grid; grid-template-columns: 1fr auto; gap: 8mm; align-items: end; padding-bottom: 5mm; border-bottom: 2.5px solid var(--tinta); }
  .cab__tipo { font-size: 7.5pt; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--coral); }
  .cab h1 { font-size: 30pt; font-weight: 800; letter-spacing: -.03em; line-height: 1; margin-top: 2mm; }
  .cab__areas { margin-top: 2mm; font-size: 9.5pt; font-weight: 600; color: var(--tinta-2); }
  .cab__data { font-size: 7.5pt; color: var(--tinta-3); text-align: right; }

  h2 { font-size: 11pt; font-weight: 800; letter-spacing: -.01em; margin: 7mm 0 2.5mm; display: flex; align-items: center; gap: 3mm; break-after: avoid; }
  h2 .n { font-size: 7.5pt; font-weight: 700; color: #fff; background: var(--coral); border-radius: 99px; min-width: 5.5mm; height: 5.5mm; display: inline-grid; place-items: center; padding: 0 1.6mm; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--linha); }

  /* identificação */
  .ident { display: grid; grid-template-columns: repeat(2, 1fr); border: 1px solid var(--linha); border-radius: 3mm; overflow: hidden; }
  .ident div { padding: 2.2mm 3.5mm; border-bottom: 1px solid var(--linha); }
  .ident div:nth-child(odd) { border-right: 1px solid var(--linha); }
  .ident div:nth-last-child(-n+2) { border-bottom: 0; }
  .ident dt { font-size: 6.5pt; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-3); }
  .ident dd { font-size: 9pt; font-weight: 600; }
  .ident a { color: inherit; text-decoration: none; }

  /* minicurrículo */
  .mini { background: var(--fundo-suave); border-left: 3px solid var(--coral); border-radius: 0 3mm 3mm 0; padding: 3.5mm 4.5mm; font-size: 9.2pt; line-height: 1.65; color: var(--tinta); }
  .mini__nota { margin-top: 1.5mm; font-size: 7pt; color: var(--tinta-3); }

  .numeros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3mm; }
  .numeros div { border: 1px solid var(--linha); border-radius: 3mm; padding: 2.5mm 3.5mm; }
  .numeros b { display: block; font-size: 17pt; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
  .numeros small { font-size: 7pt; color: var(--tinta-2); }

  .premios { list-style: none; display: grid; gap: 1.8mm; }
  .premios li { display: grid; grid-template-columns: 5mm 1fr; font-size: 8.8pt; }
  .premios li::before { content: "★"; color: var(--coral); }
  .premios b { font-weight: 700; }

  /* histórico */
  table { width: 100%; border-collapse: collapse; }
  thead th { font-size: 6.5pt; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-3); text-align: left; padding: 0 2mm 1.5mm 0; border-bottom: 1.5px solid var(--tinta); }
  tbody tr { border-bottom: 1px solid var(--linha); break-inside: avoid; }
  td { padding: 1.8mm 2.5mm 1.8mm 0; vertical-align: top; font-size: 8pt; line-height: 1.4; }
  td.ano { width: 16mm; color: var(--tinta-2); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.tit { width: 50mm; font-weight: 700; }
  td.tit .estrela { color: var(--coral); }
  td.det { color: var(--tinta-2); }
  td.fon { width: 30mm; padding-right: 0; }
  td.fon a { display: inline-block; margin: 0 1.2mm .8mm 0; font-size: 7pt; font-weight: 600; color: var(--coral); text-decoration: none; border-bottom: 1px solid rgba(217,68,47,.35); }
  td.fon .sem { font-size: 7pt; color: var(--tinta-3); }

  .habil { display: flex; flex-wrap: wrap; gap: 1.6mm; }
  .habil span { font-size: 7.8pt; font-weight: 600; border: 1px solid var(--linha); border-radius: 99px; padding: .8mm 3mm; }

  .fim { margin-top: 8mm; padding-top: 3mm; border-top: 1px solid var(--linha); display: flex; justify-content: space-between; gap: 6mm; font-size: 7.2pt; color: var(--tinta-3); }
  .fim a { color: var(--coral); text-decoration: none; font-weight: 600; }
  .erro { padding: 20px; color: #b00; }
</style>
</head>
<body>
<div class="barra">
  <span>Currículo artístico — padrão para editais. Na impressão: “Salvar como PDF”, A4, com gráficos de fundo.</span>
  <button type="button" onclick="window.print()">Gerar PDF</button>
</div>
<main class="folha" id="folha"></main>

<script src="site/pdf-dados.js"></script>
<script>
(async () => {
  const { carregar, producoes, h, area, anosDeCarreira, mesAno, MINI, CONTATO: C, finalizar } = window.PDF;
  const folha = document.getElementById('folha');
  try {
    const { itens, premios } = await carregar();

    // cabeçalho
    folha.append(h('header', { class: 'cab' },
      h('div', {},
        h('p', { class: 'cab__tipo', text: 'Currículo artístico' }),
        h('h1', { text: C.nome }),
        h('p', { class: 'cab__areas', text: C.areas })),
      h('p', { class: 'cab__data', text: `Atualizado em ${mesAno()}` })));

    // 1. identificação
    const campo = (rotulo, valor, link) => h('div', {}, h('dt', { text: rotulo }), h('dd', {}, link ? h('a', { href: link, text: valor }) : valor));
    folha.append(h('h2', {}, h('span', { class: 'n', text: '1' }), 'Identificação do agente cultural'),
      h('dl', { class: 'ident' },
        campo('Nome artístico', C.nome),
        campo('Município / UF de atuação', C.cidade),
        campo('Áreas de atuação', C.areas.replace(/ · /g, ', ')),
        campo('Linguagens', C.linguagens),
        campo('Em atividade desde', `2012 (${anosDeCarreira()} anos de trajetória)`),
        campo('Portfólio online', C.site, C.siteUrl),
        campo('E-mail', C.email, 'mailto:' + C.email),
        campo('Telefone / WhatsApp', C.fone),
      ));

    // 2. minicurrículo
    folha.append(h('h2', {}, h('span', { class: 'n', text: '2' }), 'Minicurrículo'),
      h('p', { class: 'mini', text: MINI }),
      h('p', { class: 'mini__nota', text: `${MINI.length} caracteres — texto pronto para colar no campo “minicurrículo” dos formulários.` }));

    // 3. em números + prêmios
    const conta = (a) => itens.filter((it) => area(it) === a).length;
    folha.append(h('h2', {}, h('span', { class: 'n', text: '3' }), 'Resumo da trajetória'),
      h('div', { class: 'numeros' },
        h('div', {}, h('b', { text: String(producoes(itens)) }), h('small', { text: 'produções artísticas' })),
        h('div', {}, h('b', { text: String(anosDeCarreira()) }), h('small', { text: 'anos de atuação (desde 2012)' })),
        h('div', {}, h('b', { text: String(conta('teatro')) }), h('small', { text: 'trabalhos em teatro como ator' })),
        h('div', {}, h('b', { text: String(premios.length) }), h('small', { text: 'curtas premiados' }))));

    folha.append(h('h2', {}, h('span', { class: 'n', text: '4' }), 'Prêmios e seleções'),
      h('ul', { class: 'premios' }, premios.flatMap((p) => p.premio.split(/\s*·\s*/).map((pr) =>
        h('li', {}, h('span', {}, h('b', { text: `${p.titulo} (${p.ano})` }), ' — ', pr))))));

    // 5. histórico por área
    const AREAS = [
      ['audiovisual', 'Audiovisual — cinema e websérie'],
      ['teatro', 'Teatro — atuação'],
      ['roteiro', 'Roteiro e assistência de direção'],
      ['sonoplastia', 'Sonoplastia e projeções cênicas'],
      ['dublagem', 'Dublagem'],
      ['formacao', 'Formação'],
    ];
    let n = 5;
    for (const [chave, nome] of AREAS) {
      const lista = itens.filter((it) => area(it) === chave);
      if (!lista.length) continue;
      folha.append(h('h2', {}, h('span', { class: 'n', text: String(n++) }), `${nome} (${lista.length})`),
        h('table', {},
          h('thead', {}, h('tr', {}, ['Ano', 'Trabalho', 'Função e realização', 'Comprovação'].map((t) => h('th', { text: t })))),
          h('tbody', {}, lista.map((it) => h('tr', {},
            h('td', { class: 'ano', text: it.ano }),
            h('td', { class: 'tit' }, it.premiado ? h('span', { class: 'estrela', text: '★ ' }) : null, it.titulo),
            h('td', { class: 'det' }, it.meta, it.extra ? h('br') : null, it.extra || null),
            h('td', { class: 'fon' }, it.fontes.length
              ? it.fontes.map((f) => h('a', { href: f.u, text: f.t + ' ↗' }))
              : h('span', { class: 'sem', text: '—' })))))));
    }

    folha.append(h('h2', {}, h('span', { class: 'n', text: String(n) }), 'Habilidades'),
      h('div', { class: 'habil' }, ['Drama', 'Comédia', 'Teatro musical', 'Teatro infantil', 'Roteiro', 'Assistência de direção',
        'Dublagem', 'Narração e locução', 'Sonoplastia', 'Projeções cênicas'].map((s) => h('span', { text: s }))));

    folha.append(h('footer', { class: 'fim' },
      h('span', { text: `${C.nome} · ${C.email} · ${C.fone} · ${C.insta}` }),
      h('span', {}, 'Fotos, vídeos e matérias: ', h('a', { href: C.siteUrl, text: C.site }))));
  } catch (e) {
    folha.append(h('p', { class: 'erro', text: 'Não foi possível montar o currículo: ' + e.message }));
  }
  await finalizar();
})();
</script>
</body>
</html>
