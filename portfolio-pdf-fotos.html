<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Nathan Silva — Portfólio artístico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 14mm 15mm 15mm; }
  @page capa { margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  :root {
    --tinta: #15151c; --tinta-2: #4b4b57; --tinta-3: #7c7c88; --linha: #dcdce3; --fundo-suave: #f4f4f7;
    --coral: #d9442f; --noite: #090a12; --f: 'Plus Jakarta Sans', system-ui, sans-serif;
  }
  body { font-family: var(--f); color: var(--tinta); font-size: 9pt; line-height: 1.5; background: #fff; }
  @media screen {
    body { background: #e7e7ec; padding: 64px 0 40px; }
    .folha { width: 210mm; margin: 0 auto; background: #fff; padding: 14mm 15mm 15mm; box-shadow: 0 10px 40px rgba(0,0,0,.15); }
    .capa { margin: -14mm -15mm 14mm; }
  }
  .barra { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 18px; background: #15151c; color: #eee; font: 500 13px var(--f); }
  .barra button { font: 700 13px var(--f); cursor: pointer; background: #ff5d4a; color: #fff; border: 0; border-radius: 99px; padding: 9px 20px; }
  @media print { .barra { display: none !important; } }

  /* capa (página inteira, sem margem) */
  .capa { page: capa; position: relative; width: 210mm; height: 297mm; overflow: hidden; background: var(--noite); color: #fff; break-after: page; }
  .capa__foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 30%; opacity: .78; }
  .capa::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(9,10,18,.97) 0%, rgba(9,10,18,.75) 38%, rgba(9,10,18,.1) 70%),
                linear-gradient(100deg, rgba(255,93,74,.28), rgba(111,227,255,0) 45%); }
  .capa__topo, .capa__base { position: absolute; left: 16mm; right: 16mm; z-index: 1; }
  .capa__topo { top: 15mm; display: flex; justify-content: space-between; font-size: 7.5pt; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
  .capa__topo span:last-child { color: rgba(255,255,255,.7); text-align: right; }
  .capa__base { bottom: 16mm; }
  .capa h1 { font-size: 54pt; font-weight: 800; letter-spacing: -.04em; line-height: .92; }
  .capa h1 em { font-style: normal; color: #ff7a5c; }
  .capa__areas { margin-top: 4mm; font-size: 11pt; font-weight: 600; color: rgba(255,255,255,.88); }
  .capa__linha { margin-top: 7mm; padding-top: 4mm; border-top: 1px solid rgba(255,255,255,.22); display: flex; flex-wrap: wrap; gap: 2mm 7mm; font-size: 8pt; color: rgba(255,255,255,.8); }
  .capa__linha b { color: #fff; }

  h2 { font-size: 15pt; font-weight: 800; letter-spacing: -.02em; margin: 0 0 1.5mm; break-after: avoid; }
  .sub { font-size: 8.5pt; color: var(--tinta-2); margin-bottom: 5mm; break-after: avoid; }
  .secao { break-before: page; }
  .secao--segue { break-before: auto; margin-top: 9mm; }

  .mini { background: var(--fundo-suave); border-left: 3px solid var(--coral); border-radius: 0 3mm 3mm 0; padding: 4mm 5mm; font-size: 9.6pt; line-height: 1.7; }
  .numeros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3mm; margin: 5mm 0; }
  .numeros div { border: 1px solid var(--linha); border-radius: 3mm; padding: 3mm 3.5mm; }
  .numeros b { display: block; font-size: 19pt; font-weight: 800; line-height: 1.1; }
  .numeros small { font-size: 7.2pt; color: var(--tinta-2); }
  .premios { list-style: none; display: grid; gap: 2mm; }
  .premios li { display: grid; grid-template-columns: 5mm 1fr; font-size: 9pt; }
  .premios li::before { content: "★"; color: var(--coral); }
  h3 { font-size: 10pt; font-weight: 800; margin: 6mm 0 2.5mm; }

  /* registros fotográficos */
  .registros { width: 100%; border-collapse: separate; border-spacing: 0 4mm; margin-top: -4mm; table-layout: fixed; }
  .registros tr { break-inside: avoid; }
  .registros td { width: 50%; vertical-align: top; padding: 0; }
  .registros td:first-child { padding-right: 2.5mm; } .registros td:last-child { padding-left: 2.5mm; }
  .reg { display: block; break-inside: avoid; border: 1px solid var(--linha); border-radius: 3mm; overflow: hidden; }
  .reg__moldura { height: 44mm; overflow: hidden; background: #111; }
  .reg__img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .reg__img--zoom { transform: scale(1.34); }
  .reg__img--cartaz { object-fit: contain; }
  .reg__txt { padding: 2.6mm 3.2mm 3mm; }
  .reg__ano { font-size: 6.8pt; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--coral); }
  .reg__tit { font-size: 9.6pt; font-weight: 800; line-height: 1.25; margin: .6mm 0 1.2mm; }
  .reg dl { display: grid; grid-template-columns: 17mm 1fr; gap: .4mm 2mm; font-size: 7.2pt; line-height: 1.35; }
  .reg dt { color: var(--tinta-3); font-weight: 600; }
  .reg dd { color: var(--tinta); }
  .reg a { color: var(--coral); text-decoration: none; font-weight: 600; word-break: break-all; }

  /* comprovações */
  .compr { width: 100%; border-collapse: collapse; }
  .compr th { font-size: 6.5pt; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-3); text-align: left; padding: 0 2mm 1.5mm 0; border-bottom: 1.5px solid var(--tinta); }
  .compr tr { break-inside: avoid; border-bottom: 1px solid var(--linha); }
  .compr td { padding: 1.6mm 2.5mm 1.6mm 0; font-size: 7.8pt; vertical-align: top; }
  .compr td:first-child { width: 15mm; font-weight: 600; color: var(--tinta-2); white-space: nowrap; }
  .compr td:nth-child(2) { width: 55mm; font-weight: 700; }
  .compr a { color: var(--coral); text-decoration: none; font-weight: 600; }
  .compr .url { display: block; font-size: 6.6pt; color: var(--tinta-3); word-break: break-all; }

  .fim { margin-top: 8mm; padding-top: 3mm; border-top: 1px solid var(--linha); display: flex; justify-content: space-between; gap: 6mm; font-size: 7.2pt; color: var(--tinta-3); }
  .fim a { color: var(--coral); text-decoration: none; font-weight: 600; }
  .erro { padding: 20px; color: #b00; }
</style>
</head>
<body>
<div class="barra">
  <span>Portfólio artístico — padrão para editais. Na impressão: “Salvar como PDF”, A4, sem margens, com gráficos de fundo.</span>
  <button type="button" onclick="window.print()">Gerar PDF</button>
</div>
<main class="folha" id="folha"></main>

<script src="site/pdf-dados.js"></script>
<script>
(async () => {
  const { carregar, producoes, h, area, legenda, anosDeCarreira, mesAno, MINI, CONTATO: C, finalizar } = window.PDF;
  const folha = document.getElementById('folha');
  const pares = (a) => a.reduce((acc, x, i) => (i % 2 ? acc[acc.length - 1].push(x) : acc.push([x]), acc), []);
  try {
    const { itens, premios, destaques } = await carregar();

    // capa
    folha.append(h('section', { class: 'capa' },
      h('img', { class: 'capa__foto', src: 'site/img/palco.webp', alt: '' }),
      h('div', { class: 'capa__topo' }, h('span', { text: 'Portfólio artístico' }), h('span', { text: `${C.cidade} · ${mesAno()}` })),
      h('div', { class: 'capa__base' },
        h('h1', {}, 'Nathan', h('br'), h('em', { text: 'Silva' })),
        h('p', { class: 'capa__areas', text: C.areas }),
        h('div', { class: 'capa__linha' },
          h('span', {}, h('b', { text: 'Em atividade desde 2012' })),
          h('span', { text: C.email }), h('span', { text: C.fone }), h('span', { text: C.insta }), h('span', { text: C.site })))));

    // apresentação
    folha.append(h('section', { class: 'secao' },
      h('h2', { text: 'Apresentação' }),
      h('p', { class: 'sub', text: 'Minicurrículo do agente cultural' }),
      h('p', { class: 'mini', text: MINI }),
      h('div', { class: 'numeros' },
        h('div', {}, h('b', { text: String(producoes(itens)) }), h('small', { text: 'produções artísticas' })),
        h('div', {}, h('b', { text: String(anosDeCarreira()) }), h('small', { text: 'anos de atuação' })),
        h('div', {}, h('b', { text: String(itens.filter((i) => area(i) === 'teatro').length) }), h('small', { text: 'trabalhos em teatro' })),
        h('div', {}, h('b', { text: String(premios.length) }), h('small', { text: 'curtas premiados' }))),
      h('h3', { text: 'Prêmios e seleções' }),
      h('ul', { class: 'premios' }, premios.flatMap((p) => p.premio.split(/\s*·\s*/).map((pr) =>
        h('li', {}, h('span', {}, h('b', { text: `${p.titulo} (${p.ano})` }), ' — ', pr)))))));

    // registros fotográficos
    folha.append(h('section', { class: 'secao secao--segue' },
      h('h2', { text: 'Registros dos trabalhos' }),
      h('p', { class: 'sub', text: 'Fotos, cartazes e frames, com ano, função, realização, local e link de comprovação.' }),
      h('table', { class: 'registros' }, h('tbody', {}, pares(destaques.map(({ w, foto }) => {
        const L = legenda(w);
        const link = (w.links || [])[0];
        const linha = (k, v) => (v ? [h('dt', { text: k }), h('dd', {}, v)] : []);
        const cartaz = /cartaz/i.test(foto);
        return h('article', { class: 'reg' },
          h('div', { class: 'reg__moldura' }, h('img', { class: 'reg__img' + (cartaz ? ' reg__img--cartaz' : '') + (/CuZQeJSKTEY/.test(foto) ? ' reg__img--zoom' : ''), src: foto, alt: `Registro de ${w.title}` })),
          h('div', { class: 'reg__txt' },
            h('p', { class: 'reg__ano', text: `${w.year} · ${w.tagline ? w.tagline.split(/ — /)[0] : ''}` }),
            h('h3', { class: 'reg__tit', text: w.title }),
            h('dl', {},
              linha('Função', L.funcao),
              linha('Direção', L.direcao),
              linha('Realização', L.grupo),
              linha('Local', L.local),
              linha('Foto', L.foto),
              link ? linha('Link', h('a', { href: link.url, text: link.label + ' ↗' })) : [])));
      })).map((par) => h('tr', {}, par.map((c) => h('td', {}, c)), par.length < 2 ? h('td') : null))))));

    // comprovações
    const comLinks = itens.filter((it) => it.fontes.length);
    folha.append(h('section', { class: 'secao' },
      h('h2', { text: 'Comprovações de atuação' }),
      h('p', { class: 'sub', text: 'Matérias, publicações e registros online de cada trabalho (links clicáveis no PDF; endereço completo para conferência).' }),
      h('table', { class: 'compr' },
        h('thead', {}, h('tr', {}, ['Ano', 'Trabalho', 'Fonte'].map((t) => h('th', { text: t })))),
        h('tbody', {}, comLinks.map((it) => h('tr', {},
          h('td', { text: it.ano }),
          h('td', { text: it.titulo }),
          h('td', {}, it.fontes.map((f) => h('div', {}, h('a', { href: f.u, text: f.t + ' ↗' }), h('span', { class: 'url', text: f.u }))))))))),
      h('footer', { class: 'fim' },
        h('span', { text: `${C.nome} · ${C.email} · ${C.fone} · ${C.insta}` }),
        h('span', {}, 'Vídeos e ficha completa: ', h('a', { href: C.siteUrl, text: C.site }))));
  } catch (e) {
    folha.append(h('p', { class: 'erro', text: 'Não foi possível montar o portfólio: ' + e.message }));
  }
  await finalizar();
})();
</script>
</body>
</html>
